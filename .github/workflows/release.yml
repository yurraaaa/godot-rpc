name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            lib_prefix: lib
            lib_ext: so
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            lib_prefix: ""
            lib_ext: dll

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Debug
        shell: bash
        run: cargo build --target ${{ matrix.target }}

      - name: Build Release
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/debug/${{ matrix.lib_prefix }}godot_rpc.${{ matrix.lib_ext }} staging/${{ matrix.lib_prefix }}godot_rpc.${{ matrix.platform }}.debug.x86_64.${{ matrix.lib_ext }}
          cp target/${{ matrix.target }}/release/${{ matrix.lib_prefix }}godot_rpc.${{ matrix.lib_ext }} staging/${{ matrix.lib_prefix }}godot_rpc.${{ matrix.platform }}.release.x86_64.${{ matrix.lib_ext }}

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: staging/*
          if-no-files-found: error

  release:
    name: Package and Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Assemble Plugin Directory
        shell: bash
        run: |
          mkdir -p addons/godot-rpc/bin
          find downloaded_artifacts -type f \( -name "*.so" -o -name "*.dll" \) -exec cp {} addons/godot-rpc/bin/ \;
          echo "Contents of addons/godot-rpc/bin:"
          ls -la addons/godot-rpc/bin/

      - name: Create Zip Package
        shell: bash
        run: |
          zip -r godot-rpc.zip addons/

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=nightly" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: |
            godot-rpc.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
